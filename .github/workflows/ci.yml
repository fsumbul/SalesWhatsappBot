name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadpulse
          POSTGRES_PASSWORD: leadpulse_dev
          POSTGRES_DB: leadpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-with-more-than-32-characters-length-123
      # Superuser — used only to run migrations (alembic/env.py prefers
      # MIGRATIONS_DATABASE_URL, falls back to this when unset).
      DATABASE_URL: postgresql+asyncpg://leadpulse:leadpulse_dev@localhost:5432/leadpulse_test
      # Restricted, non-superuser role that `alembic upgrade head` creates
      # (migration 0ba5bf6fe643_create_restricted_app_role). RLS is never
      # enforced for a Postgres superuser connection (not even with FORCE
      # ROW LEVEL SECURITY), so tenant-isolation tests must run as this role
      # or they'd pass without proving anything. See docs/architecture.md
      # "Multi-tenant izolasyon".
      LEADPULSE_APP_DB_PASSWORD: leadpulse_app_ci
      LEADPULSE_TEST_DATABASE_URL: postgresql+asyncpg://leadpulse_app:leadpulse_app_ci@localhost:5432/leadpulse_test
      REDIS_URL: redis://localhost:6379/9
      CELERY_BROKER_URL: redis://localhost:6379/10
      CELERY_RESULT_BACKEND: redis://localhost:6379/11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy src

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Test (pytest)
        run: poetry run pytest -v

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
