name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadpulse
          POSTGRES_PASSWORD: leadpulse_dev
          POSTGRES_DB: leadpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-with-more-than-32-characters-length-123
      DATABASE_URL: postgresql+asyncpg://leadpulse:leadpulse_dev@localhost:5432/leadpulse_test
      # Non-superuser role — RLS is never enforced for a Postgres superuser
      # (not even with FORCE ROW LEVEL SECURITY), so tenant-isolation tests
      # must run as a restricted role or they'd pass without proving anything.
      # See docs/architecture.md "Multi-tenant izolasyon" for the full story.
      LEADPULSE_TEST_DATABASE_URL: postgresql+asyncpg://leadpulse_app:leadpulse_app_ci@localhost:5432/leadpulse_test
      REDIS_URL: redis://localhost:6379/9
      CELERY_BROKER_URL: redis://localhost:6379/10
      CELERY_RESULT_BACKEND: redis://localhost:6379/11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy src

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Create restricted app role (for RLS tests)
        run: |
          PGPASSWORD=leadpulse_dev psql -h localhost -U leadpulse -d leadpulse_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'leadpulse_app') THEN
              CREATE ROLE leadpulse_app LOGIN PASSWORD 'leadpulse_app_ci' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO leadpulse_app;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO leadpulse_app;
          SQL

      - name: Test (pytest)
        run: poetry run pytest -v

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
