# Root docker-compose for full dev environment (api + web + infra).
# For infra-only, use `infra/docker-compose.yml` (started via `make up`).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadpulse
      POSTGRES_PASSWORD: leadpulse_dev
      POSTGRES_DB: leadpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: dev-secret-key-please-change-at-least-32-chars-long
      # Restricted, non-superuser role — required for Postgres to actually
      # enforce Row-Level Security (see docs/architecture.md). Created by
      # migration 0ba5bf6fe643_create_restricted_app_role.
      DATABASE_URL: postgresql+asyncpg://leadpulse_app:${LEADPULSE_APP_DB_PASSWORD:-leadpulse_app_dev}@postgres:5432/leadpulse
      # Superuser — used only to run `alembic upgrade head` (entrypoint below).
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://leadpulse:leadpulse_dev@postgres:5432/leadpulse
      LEADPULSE_APP_DB_PASSWORD: ${LEADPULSE_APP_DB_PASSWORD:-leadpulse_app_dev}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:3000
      # Leave LLM_PROVIDER empty to keep the app fail-closed. When using the
      # optional ollama service below, use LLM_BASE_URL=http://ollama:11434.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    entrypoint: ["sh", "-c", "alembic upgrade head && exec \"$$@\"", "--"]
    ports:
      - "8001:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  # Optional, platform-neutral local model server. Start it with
  # `docker compose --profile llm up -d ollama`, then pull the model you set
  # in LLM_MODEL. A remote or another chat-compatible server works too;
  # see docs/model-sunucusu-rehberi.md.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
