services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpulse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-leadpulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leadpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: leadpulse-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Graph + vector + full-text engine for the GraphRAG knowledge index and
  # per-customer conversation memory (see docs/adr/ADR-002-falkordb-graphrag.md).
  # Host ports are offset (6381 / 3001) so they never collide with the Redis
  # broker on 6379 or the Next.js dev server on 3000.
  falkordb:
    image: falkordb/falkordb:latest
    container_name: leadpulse-falkordb
    restart: unless-stopped
    ports:
      - "6381:6379"
      - "3001:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  falkordb_data:
