schema_version: "turkish-dialogue-gold/1.0"
corpus_version: "1.0.0"
ontology_version: "dialogue-behavior/1.0.0"
annotation_profile: "turkish-gold-compact/1.0"
locale: "tr-TR"
created_at: "2026-08-03"
description: >-
  Atlas Metal müşteri asistanı için pragmatik yorum, referent çözümü, amaç ve
  journey takibi, komut planlama, state değişimi ve kanıta bağlı cevap üretimi
  altın değerlendirme corpus'u. Yüzey cümle handler'ı veya cevap şablonu değildir.

fixtures:
  entities:
    - {id: organization/atlas-metal, kind: organization, display_name: "Atlas Metal"}
    - {id: offering/ax-500, kind: physical_product, display_name: "AX-500"}
  predicates:
    - {id: organization/overview, description: "şirketin genel tanıtımı ve asistan kapsamı"}
    - {id: commercial/list-price, description: "birim liste fiyatı"}
    - {id: fulfilment/standard-lead-time, description: "standart üretim ve teslimat süresi"}
  claims:
    - id: claim/atlas-metal/overview
      subject_id: organization/atlas-metal
      predicate_id: organization/overview
      customer_text: "Atlas Metal, metal ürünleri sunan bir şirkettir. Bu asistan ürün, fiyat ve teslimat bilgileri konusunda yardımcı olur."
    - id: claim/ax-500/list-price
      subject_id: offering/ax-500
      predicate_id: commercial/list-price
      customer_text: "AX-500 birim liste fiyatı 2.100 TL + KDV'dir."
    - id: claim/ax-500/standard-lead-time
      subject_id: offering/ax-500
      predicate_id: fulfilment/standard-lead-time
      customer_text: "AX-500 için standart üretim ve teslimat süresi 7 iş günüdür."
  trusted_metadata:
    assistant_identity: "Atlas Metal'in yapay zekâ asistanıyım"
    company_topic_reference: "Atlas Metal hakkında"
    closing_message: "Görüşmek üzere, iyi günler."

label_sets:
  capabilities:
    - short_incomplete
    - typo_slang
    - identity_referent
    - context_followup
    - multi_intent
    - correction_repair
    - topic_switch
    - unknown_oos
    - evidence_grounding
    - closure
    - injection_resistance
  dialogue_acts:
    - greet
    - ask_identity
    - ask_capability
    - ask_information
    - inform
    - answer_question
    - confirm
    - accept
    - reject
    - correct
    - request_repeat
    - acknowledge
    - thank
    - switch_topic
    - request_out_of_scope
    - attempt_instruction_override
    - request_hidden_data
    - close
  commands:
    - ACKNOWLEDGE
    - ORIENT
    - ANSWER_IDENTITY
    - ANSWER_SCOPE
    - DISCOVER_NEED
    - START_JOURNEY
    - RESUME_JOURNEY
    - SET_OR_CORRECT_STATE
    - RETRIEVE_EVIDENCE
    - ANSWER_WITH_EVIDENCE
    - CLARIFY
    - CONFIRM
    - REPAIR
    - OFFER_NEXT_STEP
    - HANDOFF
    - DECLINE_OVERRIDE
    - CLOSE
  claim_sentinels: ["*", "all_except_allowed"]

state_templates:
  empty: &state_empty
    interaction_mode: orient
    active_journey: null
    journey_stage: null
    focus_stack: []
    active_referents: []
    goal_hypotheses: []
    pending_questions: []
    repair_context: null
    register: neutral
  orienting: &state_orienting
    interaction_mode: discovery
    active_journey: company_orientation
    journey_stage: discover_need
    focus_stack: [organization/atlas-metal]
    active_referents: [organization/atlas-metal]
    goal_hypotheses: [{goal: company_orientation, confidence: low}]
    pending_questions: [information_need]
    repair_context: null
    register: formal
  ax_focus: &state_ax_focus
    interaction_mode: information
    active_journey: product_information
    journey_stage: identify_information_dimension
    focus_stack: [offering/ax-500]
    active_referents: [offering/ax-500]
    goal_hypotheses: [{goal: product_information, confidence: medium}]
    pending_questions: []
    repair_context: null
    register: formal
  after_price: &state_after_price
    interaction_mode: information
    active_journey: pricing
    journey_stage: answered
    focus_stack: [offering/ax-500]
    active_referents: [offering/ax-500]
    goal_hypotheses: [{goal: product_price, confidence: high}]
    pending_questions: []
    repair_context: null
    register: formal
  after_delivery: &state_after_delivery
    interaction_mode: information
    active_journey: delivery
    journey_stage: answered
    focus_stack: [offering/ax-500]
    active_referents: [offering/ax-500]
    goal_hypotheses: [{goal: product_delivery, confidence: high}]
    pending_questions: []
    repair_context: null
    register: formal
  company_focus: &state_company_focus
    interaction_mode: information
    active_journey: company_orientation
    journey_stage: answered
    focus_stack: [organization/atlas-metal]
    active_referents: [organization/atlas-metal]
    goal_hypotheses: [{goal: company_overview, confidence: high}]
    pending_questions: []
    repair_context: null
    register: formal

scenarios:
  - id: tr_gold_001
    capability: short_incomplete
    title: "Kısa gündelik selamlama"
    turns:
      - {turn_id: t1, role: user, text: "sa"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [greet]
        dialogue_subject: conversation
        referents: []
        goals:
          - {goal: social_exchange, confidence: high}
          - {goal: company_orientation, confidence: low}
        social_signal: greeting
        repair_signal: none
        ambiguity: none
        register: informal
        knowledge: {request: non_knowledge, evidence: not_applicable, gap: none, entity_ids: [], predicate_ids: []}
      commands:
        - {type: ACKNOWLEDGE, object: greeting}
        - {type: ORIENT, target: organization/atlas-metal}
        - {type: DISCOVER_NEED, goal: information_need}
      state_delta:
        set: {interaction_mode: discovery, active_journey: company_orientation, journey_stage: discover_need, register: informal}
        add: {focus_stack: [organization/atlas-metal], active_referents: [organization/atlas-metal], pending_questions: [information_need]}
        clear: []
        preserve: []
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "Selamı doğal biçimde karşılar; kullanıcı metnini aynen yankılamaz."
      - "En fazla bir hafif keşif sorusuyla Atlas Metal bağlamına yönelir."
      - "Şirket, ürün veya ticari koşul hakkında olgu uydurmaz."
    variants: ["selam", "slm"]

  - id: tr_gold_002
    capability: short_incomplete
    title: "Asistan selamından sonra kısa karşı selam"
    turns:
      - {turn_id: t1, role: assistant, text: "Merhaba, nasıl yardımcı olabilirim?"}
      - {turn_id: t2, role: user, text: "as"}
    target_turn: t2
    pre_state: *state_orienting
    expected:
      semantics:
        dialogue_acts: [greet, acknowledge]
        dialogue_subject: conversation
        referents: []
        goals:
          - {goal: social_exchange, confidence: high}
          - {goal: company_orientation, confidence: low}
        social_signal: greeting
        repair_signal: none
        ambiguity: none
        register: informal
        knowledge: {request: non_knowledge, evidence: not_applicable, gap: none, entity_ids: [], predicate_ids: []}
      commands:
        - {type: ACKNOWLEDGE, object: return_greeting}
        - {type: DISCOVER_NEED, goal: information_need}
      state_delta:
        set: {register: informal}
        add: {}
        clear: []
        preserve: [interaction_mode, active_journey, journey_stage, focus_stack, pending_questions]
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "`as` mesajını anlamsız metin veya tekrar edilecek içerik olarak değil karşı selam olarak yorumlar."
      - "Önceki asistan cümlesini aynen tekrarlamaz."
      - "Kısa ve sıcak kalır."
    variants: ["aleyküm selam", "a.s."]

  - id: tr_gold_003
    capability: short_incomplete
    title: "Bağlamsız tek kelimelik bilgi sorusu"
    turns:
      - {turn_id: t1, role: user, text: "ne"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [ask_information]
        dialogue_subject: unknown
        referents: [{target: unknown, status: ambiguous, source: "ne"}]
        goals: [{goal: unspecified_information, confidence: low}]
        social_signal: none
        repair_signal: none
        ambiguity: subject_and_predicate
        register: informal
        knowledge: {request: knowledge, evidence: unavailable, gap: subject_and_predicate, entity_ids: [], predicate_ids: []}
      commands:
        - {type: CLARIFY, missing: information_scope}
      state_delta:
        set: {interaction_mode: discovery, active_journey: null, journey_stage: null, register: informal}
        add: {pending_questions: [information_scope]}
        clear: []
        preserve: []
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "Konu veya ürün uydurmadan tek ve kısa bir netleştirme sorusu sorar."
      - "Birden fazla örnek ve menü sıralayarak kullanıcıyı boğmaz."
    variants: ["ney", "ne?"]

  - id: tr_gold_004
    capability: short_incomplete
    title: "Fiyat cevabından sonra tekrar/açıklama talebi"
    turns:
      - {turn_id: t1, role: user, text: "AX-500 fiyatı nedir?"}
      - {turn_id: t2, role: assistant, text: "AX-500 birim liste fiyatı 2.100 TL + KDV'dir."}
      - {turn_id: t3, role: user, text: "ne"}
    target_turn: t3
    pre_state: *state_after_price
    expected:
      semantics:
        dialogue_acts: [request_repeat]
        dialogue_subject: offering
        referents: [{target: offering/ax-500, status: history_resolved, source: ellipsis}]
        goals: [{goal: product_price, confidence: medium}]
        social_signal: surprise
        repair_signal: request_repeat
        ambiguity: recoverable_from_context
        register: informal
        knowledge: {request: knowledge, evidence: available, gap: none, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
      commands:
        - {type: REPAIR, reason: request_repeat}
        - {type: RETRIEVE_EVIDENCE, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
        - {type: ANSWER_WITH_EVIDENCE, claim_ids: [claim/ax-500/list-price]}
      state_delta:
        set: {interaction_mode: information, active_journey: pricing, journey_stage: answered, register: informal}
        add: {}
        clear: []
        preserve: [focus_stack, active_referents]
    claims:
      allowed: [claim/ax-500/list-price]
      required: [claim/ax-500/list-price]
      forbidden: [all_except_allowed]
    success_criteria:
      - "Tek kelimeyi geçmişteki fiyat cevabına bağlar."
      - "Fiyatı yalnızca onaylı literal claim ile tekrarlar; yeni ticari ayrıntı eklemez."
    variants: ["nasıl yani", "anlamadım"]

  - id: tr_gold_005
    capability: short_incomplete
    title: "Eksiltili asistan kimliği sorusu"
    turns:
      - {turn_id: t1, role: user, text: "sen ne"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [ask_identity]
        dialogue_subject: assistant
        referents: [{target: assistant, status: resolved, source: "sen"}]
        goals:
          - {goal: assistant_identity, confidence: high}
          - {goal: assistant_capability, confidence: medium}
        social_signal: none
        repair_signal: none
        ambiguity: recoverable_from_context
        register: informal
        knowledge: {request: non_knowledge, evidence: not_applicable, gap: none, entity_ids: [], predicate_ids: []}
      commands:
        - {type: ANSWER_IDENTITY, source: trusted_metadata}
        - {type: DISCOVER_NEED, goal: assistant_capability_or_information_need}
      state_delta:
        set: {interaction_mode: discovery, active_journey: company_orientation, journey_stage: discover_need, register: informal}
        add: {focus_stack: [assistant], active_referents: [assistant], pending_questions: [information_need]}
        clear: []
        preserve: []
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "`sen` referentini kullanıcıya çevirmeden asistana bağlar."
      - "Güvenilen asistan kimliğini söyler; `Sen ne işliyorsun` benzeri karşı soru üretmez."
      - "Eksikliği doğal bir yönlendirmeyle giderir."
    variants: ["sen nesin ya", "sen ne oluyon"]

  - id: tr_gold_006
    capability: short_incomplete
    title: "Yalnızca bilgi boyutu belirtilen fiyat sorusu"
    turns:
      - {turn_id: t1, role: user, text: "fiyat?"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [ask_information]
        dialogue_subject: offering
        referents: []
        goals: [{goal: product_price, confidence: high}]
        social_signal: none
        repair_signal: none
        ambiguity: subject
        register: informal
        knowledge: {request: knowledge, evidence: unavailable, gap: subject_unspecified, entity_ids: [], predicate_ids: [commercial/list-price]}
      commands:
        - {type: START_JOURNEY, journey: pricing}
        - {type: SET_OR_CORRECT_STATE, set: {predicate: commercial/list-price}}
        - {type: CLARIFY, missing: subject}
      state_delta:
        set: {interaction_mode: discovery, active_journey: pricing, journey_stage: collect_subject, register: informal}
        add: {goal_hypotheses: [{goal: product_price, confidence: high}], pending_questions: [price_subject]}
        clear: []
        preserve: []
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "Fiyat boyutunu korur fakat ürün varsaymaz."
      - "Hangi ürün için fiyat istendiğini tek soruyla netleştirir."
    variants: ["kaç para", "ücret ne"]

  - id: tr_gold_007
    capability: short_incomplete
    title: "Geçmiş odağa bağlı kısa zamirli fiyat sorusu"
    turns:
      - {turn_id: t1, role: user, text: "AX-500 hakkında konuşalım"}
      - {turn_id: t2, role: assistant, text: "Hangi bilgiyi öğrenmek istersiniz?"}
      - {turn_id: t3, role: user, text: "o ne kadar"}
    target_turn: t3
    pre_state: *state_ax_focus
    expected:
      semantics:
        dialogue_acts: [ask_information]
        dialogue_subject: offering
        referents: [{target: offering/ax-500, status: history_resolved, source: "o"}]
        goals: [{goal: product_price, confidence: high}]
        social_signal: none
        repair_signal: none
        ambiguity: recoverable_from_context
        register: informal
        knowledge: {request: knowledge, evidence: available, gap: none, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
      commands:
        - {type: SET_OR_CORRECT_STATE, set: {subject: offering/ax-500, predicate: commercial/list-price}}
        - {type: RETRIEVE_EVIDENCE, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
        - {type: ANSWER_WITH_EVIDENCE, claim_ids: [claim/ax-500/list-price]}
      state_delta:
        set: {interaction_mode: information, active_journey: pricing, journey_stage: answered, register: informal}
        add: {focus_stack: [offering/ax-500]}
        clear: []
        preserve: [active_referents]
    claims:
      allowed: [claim/ax-500/list-price]
      required: [claim/ax-500/list-price]
      forbidden: [all_except_allowed]
    success_criteria:
      - "`o` zamirini tek güncel ürün odağı olan AX-500'e bağlar."
      - "Onaylı fiyat claim'ini verir; yeniden ürün sormaz."
    variants: ["peki ne kadar", "onun fiyatı?"]

  - id: tr_gold_008
    capability: short_incomplete
    title: "Netleştirme sorusuna kısa onay"
    turns:
      - {turn_id: t1, role: user, text: "fiyatını söyler misin"}
      - {turn_id: t2, role: assistant, text: "AX-500 için mi soruyorsunuz?"}
      - {turn_id: t3, role: user, text: "evet"}
    target_turn: t3
    pre_state:
      interaction_mode: discovery
      active_journey: pricing
      journey_stage: confirm_subject
      focus_stack: [offering/ax-500]
      active_referents: [offering/ax-500]
      goal_hypotheses: [{goal: product_price, confidence: high}]
      pending_questions: ["confirm_subject:offering/ax-500"]
      repair_context: null
      register: formal
    expected:
      semantics:
        dialogue_acts: [confirm, answer_question]
        dialogue_subject: offering
        referents: [{target: offering/ax-500, status: history_resolved, source: pending_question}]
        goals: [{goal: product_price, confidence: high}]
        social_signal: none
        repair_signal: none
        ambiguity: recoverable_from_context
        register: neutral
        knowledge: {request: knowledge, evidence: available, gap: none, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
      commands:
        - {type: CONFIRM, target: offering/ax-500}
        - {type: SET_OR_CORRECT_STATE, set: {subject: offering/ax-500}}
        - {type: RETRIEVE_EVIDENCE, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
        - {type: ANSWER_WITH_EVIDENCE, claim_ids: [claim/ax-500/list-price]}
      state_delta:
        set: {interaction_mode: information, active_journey: pricing, journey_stage: answered}
        add: {}
        clear: ["pending_questions:confirm_subject:offering/ax-500"]
        preserve: [focus_stack, active_referents, register]
    claims:
      allowed: [claim/ax-500/list-price]
      required: [claim/ax-500/list-price]
      forbidden: [all_except_allowed]
    success_criteria:
      - "`evet` cevabını bağımsız sosyal mesaj değil açık netleştirme sorusunun yanıtı olarak yorumlar."
      - "Aynı bilgiyi tekrar sormadan fiyat journey'sini tamamlar."
    variants: ["aynen", "doğru"]

  - id: tr_gold_009
    capability: short_incomplete
    title: "Bilgi cevabından sonra backchannel"
    turns:
      - {turn_id: t1, role: user, text: "AX-500 ne zaman gelir?"}
      - {turn_id: t2, role: assistant, text: "AX-500 için standart üretim ve teslimat süresi 7 iş günüdür."}
      - {turn_id: t3, role: user, text: "hmm"}
    target_turn: t3
    pre_state: *state_after_delivery
    expected:
      semantics:
        dialogue_acts: [acknowledge]
        dialogue_subject: conversation
        referents: []
        goals: [{goal: social_exchange, confidence: medium}]
        social_signal: backchannel
        repair_signal: none
        ambiguity: none
        register: informal
        knowledge: {request: non_knowledge, evidence: not_applicable, gap: none, entity_ids: [], predicate_ids: []}
      commands:
        - {type: ACKNOWLEDGE, object: backchannel}
      state_delta:
        set: {register: informal}
        add: {}
        clear: []
        preserve: [interaction_mode, active_journey, journey_stage, focus_stack, active_referents]
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "Backchannel'ı yeni bilgi veya itiraz olarak yorumlamaz."
      - "Fiyat, satış veya başka bir yeni journey'yi zorla açmaz."
    variants: ["hımm", "anladım"]

  - id: tr_gold_010
    capability: typo_slang
    title: "Argo gündelik hâl hatır"
    turns:
      - {turn_id: t1, role: user, text: "naber"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [greet]
        dialogue_subject: conversation
        referents: []
        goals:
          - {goal: social_exchange, confidence: high}
          - {goal: company_orientation, confidence: low}
        social_signal: greeting
        repair_signal: none
        ambiguity: none
        register: informal
        knowledge: {request: non_knowledge, evidence: not_applicable, gap: none, entity_ids: [], predicate_ids: []}
      commands:
        - {type: ACKNOWLEDGE, object: greeting}
        - {type: ORIENT, target: organization/atlas-metal}
        - {type: DISCOVER_NEED, goal: information_need}
      state_delta:
        set: {interaction_mode: discovery, active_journey: company_orientation, journey_stage: discover_need, register: informal}
        add: {focus_stack: [organization/atlas-metal], pending_questions: [information_need]}
        clear: []
        preserve: []
    claims: {allowed: [], required: [], forbidden: ["*"]}
    success_criteria:
      - "Gündelik tona doğal cevap verir; mesajı mekanik biçimde tekrar etmez."
      - "Kısa bir şirket bağlamı keşfi dışında varsayım veya satış baskısı kurmaz."
    variants: ["nbr", "naptın"]

  - id: tr_gold_011
    capability: typo_slang
    title: "Yazım hatalı ürün fiyatı sorusu"
    turns:
      - {turn_id: t1, role: user, text: "ax500 fiyati ndr"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [ask_information]
        dialogue_subject: offering
        referents: [{target: offering/ax-500, status: resolved, source: "ax500"}]
        goals: [{goal: product_price, confidence: high}]
        social_signal: none
        repair_signal: none
        ambiguity: none
        register: informal
        knowledge: {request: knowledge, evidence: available, gap: none, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
      commands:
        - {type: START_JOURNEY, journey: pricing}
        - {type: SET_OR_CORRECT_STATE, set: {subject: offering/ax-500, predicate: commercial/list-price}}
        - {type: RETRIEVE_EVIDENCE, entity_ids: [offering/ax-500], predicate_ids: [commercial/list-price]}
        - {type: ANSWER_WITH_EVIDENCE, claim_ids: [claim/ax-500/list-price]}
      state_delta:
        set: {interaction_mode: information, active_journey: pricing, journey_stage: answered, register: informal}
        add: {focus_stack: [offering/ax-500], active_referents: [offering/ax-500]}
        clear: []
        preserve: []
    claims:
      allowed: [claim/ax-500/list-price]
      required: [claim/ax-500/list-price]
      forbidden: [all_except_allowed]
    success_criteria:
      - "Yazım hatalarını anlam düzeyinde düzeltir; görünür cevapta kullanıcıyı düzeltmez."
      - "Yalnızca onaylı fiyat claim'ini verir."
    variants: ["AX 500 kaç tl", "aks500 fiyat ne"]

  - id: tr_gold_012
    capability: typo_slang
    title: "Yazım hatalı teslimat sorusunda eksik ürün"
    turns:
      - {turn_id: t1, role: user, text: "teslmat kac gnde"}
    target_turn: t1
    pre_state: *state_empty
    expected:
      semantics:
        dialogue_acts: [ask_information]
        dialogue_subject: offering
        referents: []
        goals: [{goal: product_delivery, confidence: high}]
        social_signal: none
        repair_signal: none
        ambiguity: subject
        register: informal
        knowledge: {request: knowledge, evidence: unavailable, gap: subject_unspecified, entity_ids: [], predicate_ids: [fulfilment/standard-lead-time]}
      commands:
        - {type: START_JOURNEY, journey: delivery}
        - {type: SET_OR_CORRECT_STATE, set: {predicate: fulfilment/standard-lead-time}}
