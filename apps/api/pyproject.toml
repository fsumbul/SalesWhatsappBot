[tool.poetry]
name = "leadpulse-api"
version = "0.1.0"
description = "LeadPulse backend API"
authors = ["LeadPulse <dev@leadpulse.local>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
greenlet = "^3.1.1"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.2.0"
httpx = "^0.27.2"
tenacity = "^9.0.0"
structlog = "^24.4.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "3.2.2"
phonenumbers = "^8.13.49"
python-multipart = "^0.0.17"
email-validator = "^2.2.0"
playwright = "^1.61.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.4"
mypy = "^1.13.0"
testcontainers = { extras = ["postgres", "redis"], version = "^4.8.2" }
httpx = "^0.27.2"
celery-types = "^0.26.0"
respx = "^0.23.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "S", "RUF"]
# S101: assert is fine in this codebase (used outside tests too, e.g. defensive checks).
# E501: line length is handled by the formatter, not worth a hard error.
# N811: `from sqlalchemy.dialects.postgresql import UUID as PgUUID` is a
# deliberate, repeated project convention (every models.py does this) to
# avoid shadowing `uuid.UUID`, which is also imported in the same files.
ignore = ["S101", "E501", "N811"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["src/*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",  # Protocol / stub method bodies
]
